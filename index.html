<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Literature Store - Sách Ngoại Văn Kinh Điển</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .modal { transition: opacity 0.25s ease; }
        body.modal-active { overflow: hidden; }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <header class="bg-amber-950 text-white shadow-md sticky top-0 z-40 border-b-2 border-amber-600">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <h1 class="text-2xl font-serif font-bold tracking-wider"><i class="fa-solid fa-feather-pointed mr-2 text-amber-400"></i>CLASSIC BOOKS</h1>
            
            <div class="relative w-full md:w-96">
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Tìm tựa sách kinh điển hoặc tác giả..." class="w-full bg-amber-900 text-white placeholder-amber-300 rounded-lg pl-10 pr-4 py-2 focus:outline-none focus:ring-2 focus:ring-amber-400 border border-transparent focus:border-transparent">
                <span class="absolute left-3 top-2.5 text-amber-300"><i class="fa-solid fa-magnifying-glass"></i></span>
            </div>
            
            <div class="relative cursor-pointer text-xl" onclick="toggleCartModal()">
                <i class="fa-solid fa-book-bookmark text-amber-400"></i>
                <span id="cartCount" class="absolute -top-2 -right-3 bg-emerald-600 text-xs text-white rounded-full w-5 h-5 flex items-center justify-center font-bold">0</span>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 flex-grow">
        <div id="booksGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            </div>

        <div class="flex justify-center items-center mt-12 gap-2" id="paginationControls">
            </div>
    </main>

    <footer class="bg-stone-900 text-stone-400 text-center py-6 mt-12 border-t border-stone-800">
        <p>&copy; 2026 Classic Books Store. Tinh hoa Văn học Ngoại văn.</p>
    </footer>

    <div id="cartModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-50" onclick="toggleCartModal()"></div>
        
        <div class="modal-container bg-white w-full max-w-lg mx-auto rounded shadow-lg z-50 overflow-y-auto max-h-[90vh]">
            <div class="modal-content py-4 text-left px-6">
                <div class="flex justify-between items-center pb-3 border-b border-gray-200">
                    <p class="text-2xl font-serif font-bold text-stone-800"><i class="fa-solid fa-basket-shopping mr-2 text-amber-900"></i>Đơn hàng của bạn</p>
                    <div class="modal-close cursor-pointer z-50" onclick="toggleCartModal()">
                        <i class="fa-solid fa-xmark text-xl text-gray-500 hover:text-black"></i>
                    </div>
                </div>

                <div id="cartItemsList" class="my-4 divide-y divide-gray-100">
                    </div>

                <div class="text-right font-bold text-lg text-amber-900 mb-4" id="cartTotal">
                    Tổng cộng: 0đ
                </div>

                <form id="orderForm" target="hidden_iframe" onsubmit="submitted=true;" action=" https://docs.google.com/forms/d/e/1FAIpQLSePahb-phlTbLg0nq-koa1TLQX92okB7_FJxJjr1WN9iSdnxw/formResponse " method="POST" class="space-y-4 border-t pt-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Họ và tên *</label>
                        <input type="text" name="entry.1357496465" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 border focus:border-amber-500 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Số điện thoại *</label>
                        <input type="tel" name="entry.578842422" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 border focus:border-amber-500 focus:ring-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">Địa chỉ nhận hàng *</label>
                        <textarea name="entry.599224227" required rows="2" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 bg-gray-50 border focus:border-amber-500 focus:ring-amber-500"></textarea>
                    </div>

                    <input type="hidden" id="hiddenOrderDetails" name="entry.444444444">

                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 px-4 rounded-lg shadow transition duration-200">
                        <i class="fa-solid fa-circle-check mr-2"></i> Xác nhận đặt hàng
                    </button>
                </form>
                
                <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;" onload="if(submitted) { showPaymentStep(); }"></iframe>
            </div>
        </div>
    </div>

    <div id="paymentModal" class="modal opacity-0 pointer-events-none fixed w-full h-full top-0 left-0 flex items-center justify-center z-50">
        <div class="modal-overlay absolute w-full h-full bg-gray-900 opacity-60"></div>
        <div class="bg-white w-full max-w-md mx-auto rounded-lg shadow-xl z-50 p-6 text-center">
            <div class="text-emerald-500 text-5xl mb-2"><i class="fa-solid fa-circle-check"></i></div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Đặt hàng thành công!</h3>
            <p class="text-sm text-gray-600 mb-4">Hệ thống đã ghi nhận đơn hàng. Quý khách vui lòng quét mã QR dưới đây để hoàn tất chuyển khoản thanh toán thủ công.</p>
            
            <div class="bg-gray-100 p-3 rounded-lg inline-block mb-4">
                <img src="Anh_QR_Code.jpg" alt="Mã QR Thanh Toán" class="w-64 h-64 mx-auto object-cover border-2 border-amber-200 rounded">
            </div>
            
            <p class="text-xs text-red-600 font-semibold mb-4">Nội dung CK: [Họ tên khách] + [Số điện thoại]</p>
            <button onclick="closeAllModals()" class="w-full bg-amber-950 hover:bg-amber-900 text-white font-bold py-2 px-4 rounded transition">
                Hoàn thành & Đóng
            </button>
        </div>
    </div>

    <script>
        let submitted = false;

        // Cập nhật danh sách 12 cuốn sách theo yêu cầu của bạn (9 cuốn yêu cầu + 3 cuốn bổ sung cùng chủ đề)
        const booksData = [
            { id: 1, title: "The Count of Monte Cristo", author: "Alexandre Dumas", price: 345000, img: "https://images-na.ssl-images-amazon.com/images/I/71uSInC6EIL._AC_UL600_SR600,400_.jpg" },
            { id: 2, title: "The Brothers Karamazov", author: "Fyodor Dostoevsky", price: 290000, img: "https://images-na.ssl-images-amazon.com/images/I/71w7Xm8A9rL._AC_UL600_SR600,400_.jpg" },
            { id: 3, title: "The Master and Margarita", author: "Mikhail Bulgakov", price: 260000, img: "https://images-na.ssl-images-amazon.com/images/I/71p-m8lYmYL._AC_UL600_SR600,400_.jpg" },
            { id: 4, title: "Henry V", author: "William Shakespeare", price: 180000, img: "https://images-na.ssl-images-amazon.com/images/I/81S2AALZURL._AC_UL600_SR600,400_.jpg" },
            { id: 5, title: "Jane Eyre", author: "Charlotte Brontë", price: 210000, img: "https://images-na.ssl-images-amazon.com/images/I/81pwO-YmHeL._AC_UL600_SR600,400_.jpg" },
            { id: 6, title: "Animal Farm", author: "George Orwell", price: 150000, img: "https://images-na.ssl-images-amazon.com/images/I/71wDbXCHg8L._AC_UL600_SR600,400_.jpg" },
            { id: 7, title: "The Enchanted April", author: "Elizabeth von Arnim", price: 195000, img: "https://images-na.ssl-images-amazon.com/images/I/71g4I8Ssc3L._AC_UL600_SR600,400_.jpg" },
            { id: 8, title: "The Woman in White", author: "Wilkie Collins", price: 270000, img: "https://images-na.ssl-images-amazon.com/images/I/61b7L41e3HL._AC_UL600_SR600,400_.jpg" },
            { id: 9, title: "The Tenant of Wildfell Hall", author: "Anne Brontë", price: 240000, img: "https://images-na.ssl-images-amazon.com/images/I/81fH+0y8m6L._AC_UL600_SR600,400_.jpg" },
            // 3 cuốn bổ sung để tròn 12 cuốn (phân làm 2 trang, mỗi trang 6 cuốn)
            { id: 10, title: "Wuthering Heights", author: "Emily Brontë", price: 220000, img: "https://images-na.ssl-images-amazon.com/images/I/81A-f9pS69L._AC_UL600_SR600,400_.jpg" },
            { id: 11, title: "Pride and Prejudice", author: "Jane Austen", price: 190000, img: "https://images-na.ssl-images-amazon.com/images/I/81wKovwY6ML._AC_UL600_SR600,400_.jpg" },
            { id: 12, title: "Great Expectations", author: "Charles Dickens", price: 250000, img: "https://images-na.ssl-images-amazon.com/images/I/619864YkSlL._AC_UL600_SR600,400_.jpg" }
        ];

        let filteredBooks = [...booksData]; 
        let currentPage = 1;
        const itemsPerPage = 6; // Phân trang 6 loại sản phẩm một trang cố định
        let cart = {}; 

        function renderBooks() {
            const grid = document.getElementById('booksGrid');
            grid.innerHTML = "";
            
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageItems = filteredBooks.slice(startIndex, endIndex);

            if (pageItems.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Không tìm thấy cuốn sách kinh điển nào khớp từ khóa.</div>`;
                return;
            }

            pageItems.forEach(book => {
                const bookCard = `
                    <div class="bg-white rounded-xl shadow-sm overflow-hidden hover:shadow-lg transition duration-300 flex flex-col border border-stone-200/60">
                        <div class="h-72 bg-stone-100 overflow-hidden flex items-center justify-center p-4">
                            <img src="${book.img}" alt="${book.title}" class="h-full object-contain hover:scale-105 transition duration-300 shadow-md">
                        </div>
                        <div class="p-5 flex-grow flex flex-col justify-between bg-stone-50/50">
                            <div>
                                <h3 class="text-base font-serif font-bold text-stone-950 line-clamp-1">${book.title}</h3>
                                <p class="text-xs text-stone-500 mb-2">By ${book.author}</p>
                            </div>
                            <div class="mt-4 flex items-center justify-between">
                                <span class="text-amber-900 font-extrabold text-base">${book.price.toLocaleString('vi-VN')} đ</span>
                                <button onclick="addToCart(${book.id})" class="bg-amber-950 hover:bg-amber-800 text-white text-xs font-bold px-3 py-2 rounded shadow transition duration-200">
                                    <i class="fa-solid fa-plus mr-1"></i> Thêm vào giỏ
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += bookCard;
            });
            renderPagination();
        }

        function renderPagination() {
            const controls = document.getElementById('paginationControls');
            controls.innerHTML = "";
            const totalPages = Math.ceil(filteredBooks.length / itemsPerPage);

            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const activeClass = (i === currentPage) ? 'bg-amber-950 text-white' : 'bg-white text-stone-700 hover:bg-stone-100';
                controls.innerHTML += `<button onclick="goToPage(${i})" class="px-4 py-2 border border-stone-300 rounded font-medium transition ${activeClass}">${i}</button>`;
            }
        }

        function goToPage(page) {
            currentPage = page;
            renderBooks();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            filteredBooks = booksData.filter(book => 
                book.title.toLowerCase().includes(query) || 
                book.author.toLowerCase().includes(query)
            );
            currentPage = 1; 
            renderBooks();
        }

        function addToCart(id) {
            cart[id] = (cart[id] || 0) + 1;
            updateCartStatus();
            const cartIcon = document.getElementById('cartCount');
            cartIcon.classList.add('scale-125', 'bg-red-600');
            setTimeout(() => cartIcon.classList.remove('scale-125', 'bg-red-600'), 300);
        }

        function updateCartStatus() {
            let totalCount = 0;
            let totalPrice = 0;
            let detailsString = "";

            const listContainer = document.getElementById('cartItemsList');
            listContainer.innerHTML = "";

            Object.keys(cart).forEach(id => {
                const book = booksData.find(b => b.id == id);
                const quantity = cart[id];
                totalCount += quantity;
                totalPrice += book.price * quantity;
                detailsString += `${book.title} (x${quantity}) | `;

                listContainer.innerHTML += `
                    <div class="flex justify-between items-center py-2">
                        <div class="max-w-[70%]">
                            <p class="font-serif font-semibold text-sm text-stone-900 truncate">${book.title}</p>
                            <p class="text-xs text-stone-500">${book.price.toLocaleString('vi-VN')}đ x ${quantity}</p>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="changeQuantity(${id}, -1)" class="text-stone-400 hover:text-red-500 px-1"><i class="fa-solid fa-minus text-xs"></i></button>
                            <span class="text-sm font-bold w-4 text-center">${quantity}</span>
                            <button onclick="changeQuantity(${id}, 1)" class="text-stone-400 hover:text-emerald-600 px-1"><i class="fa-solid fa-plus text-xs"></i></button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('cartCount').innerText = totalCount;
            document.getElementById('cartTotal').innerText = `Tổng cộng: ${totalPrice.toLocaleString('vi-VN')} đ`;
            document.getElementById('hiddenOrderDetails').value = detailsString;
        }

        function changeQuantity(id, delta) {
            cart[id] += delta;
            if (cart[id] <= 0) delete cart[id];
            updateCartStatus();
        }

        function toggleCartModal() {
            const modal = document.getElementById('cartModal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
        }

        function showPaymentStep() {
            toggleCartModal();
            const payModal = document.getElementById('paymentModal');
            payModal.classList.remove('opacity-0', 'pointer-events-none');
            cart = {};
            updateCartStatus();
            document.getElementById('orderForm').reset();
            submitted = false;
        }

        function closeAllModals() {
            const payModal = document.getElementById('paymentModal');
            payModal.classList.add('opacity-0', 'pointer-events-none');
            document.body.classList.remove('modal-active');
        }

        window.onload = function() {
            renderBooks();
        };
    </script>
</body>
</html>
